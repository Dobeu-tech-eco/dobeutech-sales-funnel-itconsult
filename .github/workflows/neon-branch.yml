name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Truncate branch name
        run: |
          RAW_BRANCH="preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}"
          echo "TRUNC_BRANCH=${RAW_BRANCH:0:63}" >> "$GITHUB_ENV"

      - name: Prune stale branches and delete colliding preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          npm i -g neonctl@v2

          BRANCHES_JSON=$(neonctl branches list --project-id "$NEON_PROJECT_ID" -o json)

          # Delete current preview branch if it already exists (neonctl expects branch IDs)
          COLLIDING_ID=$(echo "$BRANCHES_JSON" | jq -r --arg name "${{ env.TRUNC_BRANCH }}" 'map(select(.name == $name)) | .[0].id // empty')
          if [ -n "$COLLIDING_ID" ]; then
            neonctl branches delete "$COLLIDING_ID" --project-id "$NEON_PROJECT_ID" || true
            BRANCHES_JSON=$(neonctl branches list --project-id "$NEON_PROJECT_ID" -o json)
          fi

          # Prune oldest preview branches until there's room under the 10-branch limit
          BRANCH_COUNT=$(echo "$BRANCHES_JSON" | jq 'length')
          if [ "$BRANCH_COUNT" -ge 10 ]; then
            EXCESS=$((BRANCH_COUNT - 9))
            echo "10-branch limit reached ($BRANCH_COUNT). Deleting $EXCESS oldest preview branch(es)..."
            echo "$BRANCHES_JSON" | jq -r --argjson excess "$EXCESS" 'map(select(.name | startswith("preview/pr-"))) | sort_by(.created_at) | .[0:$excess] | .[].id' | while read -r id; do
              [ -n "$id" ] && neonctl branches delete "$id" --project-id "$NEON_PROJECT_ID" || true
            done
          fi

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.TRUNC_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: salesfunnel
          role: salesfunnel_owner
          expires_at: ${{ env.EXPIRES_AT }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Truncate branch name
        run: |
          RAW_BRANCH="preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}"
          echo "TRUNC_BRANCH=${RAW_BRANCH:0:63}" >> "$GITHUB_ENV"

      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.TRUNC_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
